<!DOCTYPE html>
<html lang="en" class="operator-root">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>ProVerlay — Operator</title>
    <meta name="color-scheme" content="light dark" />
    <script src="/public/shared/app-shell.js"></script>
    <link rel="icon" href="/public/shared/proverlay-logo.png" type="image/png" />
    <link rel="stylesheet" href="/public/shared/tahoe.css" />
    <link rel="stylesheet" href="/public/shared/form-controls.css" />
    <link rel="stylesheet" href="/public/shared/operate-panel.css" />
    <link rel="stylesheet" href="/public/operator/operator.css" />
  </head>
  <body class="operator">
    <header class="pv-app-header" data-section="operator">
      <div class="pv-app-header__title"><h1 id="op-title">Operator</h1></div>
      <div class="pv-app-header__actions">
        <button type="button" class="button button--ghost button--compact pv-app-header__toggle pv-app-header__hide-narrow" id="desk-mode-toggle" aria-pressed="false" title="Desk mode: two columns on wide screens">Desk</button>
      </div>
    </header>

    <nav id="op-switcher" class="op-switcher" aria-label="Widgets" hidden></nav>

    <main id="operator-root" class="op-main"></main>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/public/shared/app-header.js"></script>
    <script type="module" src="/public/operator/operator.js"></script>
  </body>
</html>
