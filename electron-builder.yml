appId: nl.productionpro.proverlay
productName: ProVerlay
copyright: © 2026 ProductionPro — productionpro.nl
directories:
  output: dist
  buildResources: build
files:
  - electron/**
  - server/**
  - public/**
  - templates/**
  - package.json
extraResources:
  # Only seed-data/ (scripts/generate-seed-data.mjs), NOT the repo's data/ folder
  - from: seed-data
    to: seed-data
asar: false
npmRebuild: false
mac:
  category: public.app-category.video
  icon: build/icon.icns
  identity: null
  # The now-playing widget asks the Spotify app for its current track (AppleScript).
  # macOS shows this text the first time, when it asks the user for permission.
  extendInfo:
    NSAppleEventsUsageDescription: ProVerlay reads the current track from Spotify for the Now playing widget.
  # Arch is chosen on the command line: `npm run dist:mac` (arm64) and
  # `npm run dist:mac:x64` (Intel). Signing and zipping happen afterwards in
  # scripts/package-mac-app.mjs (ad-hoc by default; see docs/RELEASING.md).
  target:
    - target: dir
      arch:
        - arm64
        - x64
# Windows x64: NSIS installer, per-user by default (no admin rights needed).
# `npm run dist:win` → dist/ProVerlay-win-x64-setup.exe. Unsigned unless the CSC_* /
# WIN_CSC_* environment variables are set (see docs/RELEASING.md).
win:
  icon: build/icon.ico
  executableName: ProVerlay
  target:
    - target: nsis
      arch:
        - x64
nsis:
  # Assisted installer: "Only for me" (default, %LOCALAPPDATA%\Programs\ProVerlay)
  # or "Anyone who uses this computer" (asks for admin rights), changeable folder.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: ProVerlay
  runAfterFinish: true
  # Projects live in the user-data folder (%APPDATA%), not in the install folder:
  # an uninstall or update keeps them.
  deleteAppDataOnUninstall: false
  artifactName: ProVerlay-win-x64-setup.${ext}
