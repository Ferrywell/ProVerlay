name: Release

# Builds the Mac app (Apple Silicon + Intel) and publishes it as a GitHub release.
#
# - push of a tag vX.Y.Z      → build, verify, publish (create or update the release)
# - workflow_dispatch (tag)    → rebuild an existing tag; dry_run builds without publishing
# - pull_request (build files) → build + verify only; zips are kept as workflow artifacts
#
# See docs/RELEASING.md.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'electron/**'
      - 'electron-builder.yml'
      - 'scripts/**'
      - 'build/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, e.g. v0.7.1'
        required: true
        type: string
      dry_run:
        description: 'Build and verify only; do not create or update the GitHub release'
        type: boolean
        default: false

# Read-only by default; only the publish job gets write access.
permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || inputs.tag || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  meta:
    name: resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
      publish: ${{ steps.meta.outputs.publish }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$EVENT" in
            push) tag="$REF_NAME" ;;
            workflow_dispatch) tag="$INPUT_TAG" ;;
            *) tag="" ;;
          esac
          if [ -n "$tag" ] && ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$tag' is not a release tag (expected vX.Y.Z or vX.Y.Z-pre)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.tag != '' && format('refs/tags/{0}', steps.tag.outputs.tag) || '' }}

      - name: Check tag against package.json
        id: meta
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          version="$(jq -r .version package.json)"
          if [ -n "$TAG" ] && [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version. Bump the version (and CHANGELOG.md) before tagging."
            exit 1
          fi
          publish=false
          if [ -n "$TAG" ] && [ "$DRY_RUN" != "true" ]; then publish=true; fi
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          {
            echo "tag=${TAG:-v$version}"
            echo "version=$version"
            echo "sha=$(git rev-parse HEAD)"
            echo "publish=$publish"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "### ProVerlay v$version" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit $(git rev-parse --short HEAD) · publish: $publish · prerelease: $prerelease" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build (${{ matrix.arch }})
    needs: meta
    # macos-latest is Apple Silicon; the x64 build cross-packages the Intel Electron
    # binary (the app has no native modules, so nothing is compiled).
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: arm64
            script: dist:mac
          - arch: x64
            script: dist:mac:x64
    env:
      # electron-builder downloads its own Electron zip; the npm postinstall copy is unused.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # 'true'/'false' only — the secrets themselves are passed to the steps that use them.
      HAS_SIGNING: ${{ secrets.MAC_CERT_P12_BASE64 != '' && secrets.MAC_CERT_PASSWORD != '' && secrets.MAC_CODESIGN_IDENTITY != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.meta.outputs.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Cache Electron download
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ matrix.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ matrix.arch }}-

      - name: Build (ad-hoc signed)
        run: npm run ${{ matrix.script }}

      # ── Developer ID signing + notarization ─────────────────────────────────
      # Skipped until the secrets in docs/RELEASING.md are configured. Never runs on
      # pull requests. Re-signs the unsigned electron-builder output in dist/ and
      # overwrites the ad-hoc zip.
      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true' && github.event_name != 'pull_request'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          printf '%s' "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "MAC_CODESIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Sign with Developer ID and notarize
        if: env.HAS_SIGNING == 'true' && github.event_name != 'pull_request'
        env:
          MAC_CODESIGN_IDENTITY: ${{ secrets.MAC_CODESIGN_IDENTITY }}
          # Notarization is skipped by the script when any of these is empty.
          MAC_NOTARIZE_APPLE_ID: ${{ secrets.APPLE_ID }}
          MAC_NOTARIZE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MAC_NOTARIZE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/package-mac-app.mjs ${{ matrix.arch }}

      - name: Remove signing keychain
        if: always() && env.MAC_CODESIGN_KEYCHAIN != ''
        run: security delete-keychain "$MAC_CODESIGN_KEYCHAIN" || true
      # ────────────────────────────────────────────────────────────────────────

      - name: Verify zip
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: bash scripts/verify-mac-zip.sh "dist/ProVerlay-mac-$ARCH.zip" "$ARCH" "$VERSION"

      - uses: actions/upload-artifact@v6
        with:
          name: ProVerlay-mac-${{ matrix.arch }}
          path: dist/ProVerlay-mac-${{ matrix.arch }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ github.event_name == 'pull_request' && 5 || 14 }}

  assemble:
    name: checksums + release notes
    needs: [meta, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.meta.outputs.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/download-artifact@v7
        with:
          pattern: ProVerlay-mac-*
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: |
          sha256sum ProVerlay-mac-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p meta
          node scripts/changelog-section.mjs "$VERSION" \
            --link-base "https://github.com/$REPO/blob/$TAG/" > meta/notes.md
          cp release/SHA256SUMS.txt meta/
          {
            echo "### Release notes for $TAG"
            echo
            cat meta/notes.md
            echo
            echo '```'
            cat meta/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: release-meta
          path: meta/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 5 || 14 }}

  publish:
    name: publish GitHub release
    needs: [meta, assemble]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job with write access. It runs no repository code: it downloads the
    # verified artifacts and calls the gh CLI.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.meta.outputs.tag }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: ProVerlay-mac-*
          path: release
          merge-multiple: true

      - uses: actions/download-artifact@v7
        with:
          name: release-meta
          path: meta

      - name: Create or update the release
        run: |
          cp meta/SHA256SUMS.txt release/
          (cd release && sha256sum --check SHA256SUMS.txt)
          assets=(release/ProVerlay-mac-*.zip release/SHA256SUMS.txt)
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists — replacing assets"
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            echo "Creating release $TAG"
            flags=()
            if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
            gh release create "$TAG" "${assets[@]}" \
              --verify-tag --title "$TAG" --notes-file meta/notes.md "${flags[@]}"
          fi
          echo "Published: $(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
