name: Release

# Builds the Mac app (Apple Silicon + Intel) and the Windows x64 installer and
# publishes them as a GitHub release.
#
# - push of a tag vX.Y.Z      → build, verify, publish (create or update the release)
# - workflow_dispatch (tag)    → rebuild an existing tag; dry_run builds without publishing
# - pull_request (build files) → build + verify (+ Windows install smoke test) only;
#                                the zips and the installer are kept as workflow artifacts
#
# See docs/RELEASING.md.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'electron/**'
      - 'electron-builder.yml'
      - 'scripts/**'
      - 'build/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, e.g. v0.7.1'
        required: true
        type: string
      dry_run:
        description: 'Build and verify only; do not create or update the GitHub release'
        type: boolean
        default: false

# Read-only by default; only the publish job gets write access.
permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || inputs.tag || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  meta:
    name: resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
      publish: ${{ steps.meta.outputs.publish }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      windows: ${{ steps.meta.outputs.windows }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$EVENT" in
            push) tag="$REF_NAME" ;;
            workflow_dispatch) tag="$INPUT_TAG" ;;
            *) tag="" ;;
          esac
          if [ -n "$tag" ] && ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$tag' is not a release tag (expected vX.Y.Z or vX.Y.Z-pre)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.tag != '' && format('refs/tags/{0}', steps.tag.outputs.tag) || '' }}

      - name: Check tag against package.json
        id: meta
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          version="$(jq -r .version package.json)"
          if [ -n "$TAG" ] && [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version. Bump the version (and CHANGELOG.md) before tagging."
            exit 1
          fi
          publish=false
          if [ -n "$TAG" ] && [ "$DRY_RUN" != "true" ]; then publish=true; fi
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          # Tags before the Windows build (v0.8.0 and older) have no dist:win script;
          # rebuilding them skips the Windows job instead of failing the release.
          windows=false
          if [ -n "$(jq -r '.scripts["dist:win"] // empty' package.json)" ]; then windows=true; fi
          {
            echo "tag=${TAG:-v$version}"
            echo "version=$version"
            echo "sha=$(git rev-parse HEAD)"
            echo "publish=$publish"
            echo "prerelease=$prerelease"
            echo "windows=$windows"
          } >> "$GITHUB_OUTPUT"
          echo "### ProVerlay v$version" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit $(git rev-parse --short HEAD) · publish: $publish · prerelease: $prerelease · windows: $windows" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build (macOS arm64 + x64)
    needs: meta
    # One macos-latest (Apple Silicon) runner builds both zips one after the other.
    # GitHub's hosted macOS runners are often capacity-constrained; needing a single
    # runner instead of two makes a release far less likely to be cancelled in the
    # queue. The x64 build cross-packages the Intel Electron binary (no native modules).
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # electron-builder downloads its own Electron zip; the npm postinstall copy is unused.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # 'true'/'false' only — the secrets themselves are passed to the steps that use them.
      HAS_SIGNING: ${{ secrets.MAC_CERT_P12_BASE64 != '' && secrets.MAC_CERT_PASSWORD != '' && secrets.MAC_CODESIGN_IDENTITY != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.meta.outputs.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Cache Electron downloads
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-

      - name: Build arm64 (ad-hoc signed)
        run: npm run dist:mac

      - name: Build x64 (ad-hoc signed)
        run: npm run dist:mac:x64

      # ── Developer ID signing + notarization ─────────────────────────────────
      # Skipped until the secrets in docs/RELEASING.md are configured. Never runs on
      # pull requests. Re-signs the unsigned electron-builder output in dist/ and
      # overwrites the ad-hoc zips.
      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true' && github.event_name != 'pull_request'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          printf '%s' "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "MAC_CODESIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Sign with Developer ID and notarize
        if: env.HAS_SIGNING == 'true' && github.event_name != 'pull_request'
        env:
          MAC_CODESIGN_IDENTITY: ${{ secrets.MAC_CODESIGN_IDENTITY }}
          # Notarization is skipped by the script when any of these is empty.
          MAC_NOTARIZE_APPLE_ID: ${{ secrets.APPLE_ID }}
          MAC_NOTARIZE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MAC_NOTARIZE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node scripts/package-mac-app.mjs arm64
          node scripts/package-mac-app.mjs x64

      - name: Remove signing keychain
        if: always() && env.MAC_CODESIGN_KEYCHAIN != ''
        run: security delete-keychain "$MAC_CODESIGN_KEYCHAIN" || true
      # ────────────────────────────────────────────────────────────────────────

      - name: Verify zips
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          bash scripts/verify-mac-zip.sh dist/ProVerlay-mac-arm64.zip arm64 "$VERSION"
          bash scripts/verify-mac-zip.sh dist/ProVerlay-mac-x64.zip x64 "$VERSION"

      - uses: actions/upload-artifact@v6
        with:
          name: ProVerlay-mac-arm64
          path: dist/ProVerlay-mac-arm64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ github.event_name == 'pull_request' && 5 || 14 }}

      - uses: actions/upload-artifact@v6
        with:
          name: ProVerlay-mac-x64
          path: dist/ProVerlay-mac-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ github.event_name == 'pull_request' && 5 || 14 }}

  build-windows:
    name: build (Windows x64)
    needs: meta
    if: needs.meta.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      VERSION: ${{ needs.meta.outputs.version }}
      # 'true'/'false' only — the secrets themselves are passed to the steps that use them.
      HAS_PFX_SIGNING: ${{ secrets.WIN_CSC_LINK != '' && secrets.WIN_CSC_KEY_PASSWORD != '' }}
      HAS_AZURE_SIGNING: ${{ secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' && vars.AZURE_SIGNING_ENDPOINT != '' && vars.AZURE_SIGNING_ACCOUNT != '' && vars.AZURE_SIGNING_PROFILE != '' && vars.AZURE_SIGNING_PUBLISHER != '' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.meta.outputs.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Cache Electron downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-win-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-win-

      # ── Windows code signing ───────────────────────────────────────────────
      # Unsigned unless the secrets/variables in docs/RELEASING.md are configured.
      # Never signs on pull requests. electron-builder signs ProVerlay.exe, the
      # uninstaller and the installer itself.
      - name: Resolve signing mode
        id: signing
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          $mode = 'none'
          if ($env:IS_PR -ne 'true') {
            if ($env:HAS_AZURE_SIGNING -eq 'true') { $mode = 'azure' }
            elseif ($env:HAS_PFX_SIGNING -eq 'true') { $mode = 'pfx' }
          }
          "mode=$mode" >> $env:GITHUB_OUTPUT
          "Windows signing: $mode" >> $env:GITHUB_STEP_SUMMARY

      - name: Build installer (unsigned)
        if: steps.signing.outputs.mode == 'none'
        run: npm run dist:win

      - name: Build installer (signed with a certificate file)
        if: steps.signing.outputs.mode == 'pfx'
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run dist:win

      - name: Build installer (signed with Azure Trusted Signing)
        if: steps.signing.outputs.mode == 'azure'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
        # bash: PowerShell may swallow the `--` that hands the flags to electron-builder.
        shell: bash
        run: >-
          npm run dist:win --
          "-c.win.azureSignOptions.endpoint=$AZURE_SIGNING_ENDPOINT"
          "-c.win.azureSignOptions.codeSigningAccountName=$AZURE_SIGNING_ACCOUNT"
          "-c.win.azureSignOptions.certificateProfileName=$AZURE_SIGNING_PROFILE"
          "-c.win.azureSignOptions.publisherName=$AZURE_SIGNING_PUBLISHER"
      # ────────────────────────────────────────────────────────────────────────

      - name: Verify installer
        env:
          REQUIRE_SIGNED: ${{ steps.signing.outputs.mode != 'none' }}
        run: |
          $verifyArgs = @('dist/ProVerlay-win-x64-setup.exe', '--version', $env:VERSION, '--app-dir', 'dist/win-unpacked')
          if ($env:REQUIRE_SIGNED -eq 'true') { $verifyArgs += '--require-signed' }
          node scripts/verify-win-installer.mjs @verifyArgs
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # ── Smoke test: install → run → uninstall on the runner ─────────────────
      # scripts/smoke-test-win-installer.ps1 can be run by hand on any Windows PC.
      - name: 'Smoke test: silent per-user install'
        run: ./scripts/smoke-test-win-installer.ps1 -Phase install -Installer dist/ProVerlay-win-x64-setup.exe -Version $env:VERSION

      - name: 'Smoke test: installed server (headless)'
        run: ./scripts/smoke-test-win-installer.ps1 -Phase server -Version $env:VERSION

      # Starting the full Electron app depends on the runner's desktop session, so a
      # failure here is reported but does not fail the build.
      - name: 'Smoke test: GUI app starts the server (non-blocking)'
        continue-on-error: true
        timeout-minutes: 5
        run: ./scripts/smoke-test-win-installer.ps1 -Phase gui

      - name: 'Smoke test: silent uninstall keeps user data'
        run: ./scripts/smoke-test-win-installer.ps1 -Phase uninstall
      # ────────────────────────────────────────────────────────────────────────

      - uses: actions/upload-artifact@v6
        with:
          name: ProVerlay-win-x64
          path: dist/ProVerlay-win-x64-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ github.event_name == 'pull_request' && 5 || 14 }}

  assemble:
    name: checksums + release notes
    needs: [meta, build, build-windows]
    # build-windows is skipped (not failed) only for tags that predate it.
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (needs.build-windows.result == 'success' ||
       (needs.build-windows.result == 'skipped' && needs.meta.outputs.windows != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.meta.outputs.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/download-artifact@v7
        with:
          pattern: ProVerlay-*
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: |
          shopt -s nullglob
          sha256sum ProVerlay-mac-*.zip ProVerlay-win-*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p meta
          node scripts/changelog-section.mjs "$VERSION" \
            --link-base "https://github.com/$REPO/blob/$TAG/" > meta/notes.md
          cp release/SHA256SUMS.txt meta/
          {
            echo "### Release notes for $TAG"
            echo
            cat meta/notes.md
            echo
            echo '```'
            cat meta/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: release-meta
          path: meta/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 5 || 14 }}

  publish:
    name: publish GitHub release
    needs: [meta, assemble]
    # Explicit result check: a skipped build-windows (old tags) must not skip publishing.
    if: >-
      !cancelled() && needs.assemble.result == 'success' &&
      needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job with write access. It runs no repository code: it downloads the
    # verified artifacts and calls the gh CLI.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.meta.outputs.tag }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: ProVerlay-*
          path: release
          merge-multiple: true

      - uses: actions/download-artifact@v7
        with:
          name: release-meta
          path: meta

      - name: Create or update the release
        run: |
          cp meta/SHA256SUMS.txt release/
          (cd release && sha256sum --check SHA256SUMS.txt)
          shopt -s nullglob
          assets=(release/ProVerlay-mac-*.zip release/ProVerlay-win-*.exe release/SHA256SUMS.txt)
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists — replacing assets"
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            echo "Creating release $TAG"
            flags=()
            if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
            gh release create "$TAG" "${assets[@]}" \
              --verify-tag --title "$TAG" --notes-file meta/notes.md "${flags[@]}"
          fi
          echo "Published: $(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
