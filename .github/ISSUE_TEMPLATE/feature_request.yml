name: Feature request
description: Suggest a new widget, workflow or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please search existing issues first — maybe someone asked already.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation in your show or workflow, not only the solution.
      placeholder: During a live match I need to ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you imagine it working. Sketches or reference screenshots are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - New widget type
        - Existing widget
        - Dashboard (/control)
        - Operator (/operator)
        - Render / OBS / vMix output
        - Companion module
        - Projects, branding or assets
        - Mac / Windows app
        - API / automation
        - Documentation
        - Other
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself (see CONTRIBUTING.md)
