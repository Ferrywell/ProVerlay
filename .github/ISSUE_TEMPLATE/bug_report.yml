name: Bug report
description: Something in ProVerlay does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please check the [user guide troubleshooting section](https://github.com/Ferrywell/ProVerlay/blob/main/docs/USER-GUIDE.md#10-troubleshooting) and existing issues first.
        **Security issues:** do not report them here — see [SECURITY.md](https://github.com/Ferrywell/ProVerlay/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a "Match score" widget
        2. Click "Go live"
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Dashboard (/control)
        - Operator (/operator)
        - Render / output (/render)
        - Scoreboard editor (/editor)
        - Project, branding or assets
        - Export / import (.proverlay)
        - Companion module
        - Mac app
        - Server / API
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ProVerlay version
      description: Release version, or the commit hash when running from source.
      placeholder: v0.6.8 or 03a9bc4
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run ProVerlay?
      options:
        - Mac app
        - From source (npm start)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.5 (Apple Silicon), Windows 11, ...
    validations:
      required: true
  - type: input
    id: output
    attributes:
      label: Browser / output host
      description: Where you see the problem.
      placeholder: Chrome 140, Safari on iPad, OBS 31 Browser Source, vMix 28 Web Browser, Companion 4.3
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or recordings
      description: Server output from the terminal, browser console errors, screenshots. Remove anything you do not want to share publicly.
